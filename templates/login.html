{% extends 'base.html' %}
{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="card" style="width: 400px; border: 1px solid var(--border-color); background: var(--card-bg);">
        <h2 style="text-align: center; color: var(--text-main); margin-bottom: 8px; font-weight: 800; letter-spacing: -0.025em;">ARENA 2.0</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 32px; font-size: 0.9rem;">Gym Management System Login</p>
        <form method="POST">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" style="background: var(--bg-color); color: var(--text-main); border-color: var(--border-color);" required value="admin">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <input type="password" name="password" id="passwordInput" class="form-control" style="background: var(--bg-color); color: var(--text-main); border-color: var(--border-color);" required value="123456">
                    <button type="button" id="togglePassword" style="position: absolute; right: 12px; top: 12px; border: none; background: none; color: var(--primary); cursor: pointer; font-size: 0.75rem; font-weight: 700;">SHOW</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px; padding: 12px; font-weight: 600;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
    const toggleBtn = document.getElementById('togglePassword');
    const pwdInput = document.getElementById('passwordInput');
    toggleBtn.addEventListener('click', () => {
        if(pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleBtn.textContent = 'HIDE';
        } else {
            pwdInput.type = 'password';
            toggleBtn.textContent = 'SHOW';
        }
    });
</script>
{% endblock %}
